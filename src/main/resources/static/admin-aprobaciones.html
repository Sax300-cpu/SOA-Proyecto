<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Solicitudes Pendientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
          crossorigin="anonymous">
          <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
          <link href="/css/estilo.css" rel="stylesheet">
</head>
<body class="bg-light">
<header id="encabezado" class="bg-dark text-white py-3" data-rol="ADMIN"></header>
<main class="container py-4">
    <h1 class="mb-4">Gestión de Solicitudes Pendientes</h1>
    <div id="mensaje" class="alert" role="alert" hidden></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Usuario</th>
                <th scope="col">Equipo</th>
                <th scope="col">Fecha</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody id="tablaPendientes"></tbody>
        </table>
    </div>
    <div id="paginador" class="pie-tabla"></div>
</main>

<script src="/js/encabezado.js"></script>
<script>
    const tablaPendientes = document.getElementById("tablaPendientes");
    const fechaCorta = valor => valor ? new Date(valor).toLocaleString("es-EC", { dateStyle: "short", timeStyle: "short" }) : "—";
    let nombreEquipo = id => `#${id}`;
    let nombreUsuario = id => `#${id}`;

    function mostrarMensaje(texto, tipo = "danger") {
        const aviso = document.getElementById("mensaje");
        aviso.className = `alert alert-${tipo}`;
        aviso.textContent = texto;
        aviso.hidden = false;
    }

    async function mensajeError(respuesta) {
        const datos = await respuesta.json().catch(() => null);
        return datos?.error || datos?.detail || datos?.message || `Error HTTP ${respuesta.status}`;
    }

    function agregarCelda(fila, valor) {
        const celda = document.createElement("td");
        celda.textContent = valor ?? "";
        fila.appendChild(celda);
    }

    // Envía PUT /api/prestamos/{id}/aprobar o /rechazar con token CSRF y recarga la tabla.
    async function cambiarEstado(prestamo, accion) {
        const id = prestamo.id;
        // Al aprobar, el administrador fija el plazo de devolución (empieza a contar al entregar).
        let plazoHoras = null;
        if (accion === "aprobar") {
            plazoHoras = await pedirPlazoAprobacion(
                `Préstamo #${id} · ${nombreEquipo(prestamo.equipoId)} para ${nombreUsuario(prestamo.usuarioId)}.`);
            if (plazoHoras === null) return;
        }
        try {
            const csrfRespuesta = await fetchConSesion("/api/auth/csrf");
            if (!csrfRespuesta.ok) {
                throw new Error("No se pudo preparar la protección CSRF.");
            }
            const csrf = await csrfRespuesta.json();

            const respuesta = await fetchConSesion(`/api/prestamos/${id}/${accion}`, {
                method: "PUT",
                headers: { [csrf.headerName]: csrf.token, ...(plazoHoras === null ? {} : { "Content-Type": "application/json" }) },
                ...(plazoHoras === null ? {} : { body: JSON.stringify({ plazoHoras }) })
            });
            if (!respuesta.ok) {
                throw new Error(await mensajeError(respuesta));
            }

            mostrarMensaje(
                `Solicitud #${id} ${accion === "aprobar" ? `aprobada con plazo de ${formatearPlazo(plazoHoras)}` : "rechazada"} correctamente.`,
                "success"
            );
            await cargarPendientes(false);
        } catch (error) {
            mostrarMensaje(`No se pudo ${accion === "aprobar" ? "aprobar" : "rechazar"} la solicitud: ${error.message}`);
        }
    }

    async function cargarPendientes(reiniciar = true) {
        try {
            const respuesta = await fetchConSesion("/api/prestamos/pendientes");
            if (!respuesta.ok) {
                throw new Error(await mensajeError(respuesta));
            }

            const prestamos = await respuesta.json();
            nombreEquipo = await cargarNombresEquipos();
            nombreUsuario = await cargarNombresUsuarios();
            paginador.mostrar(prestamos, reiniciar);
        } catch (error) {
            mostrarMensaje(`No se pudieron cargar las solicitudes pendientes: ${error.message}`);
        }
    }

    // Dibuja solo las filas de la página actual (10 por página).
    function dibujarPendientes(pagina) {
        tablaPendientes.replaceChildren();

        if (pagina.length === 0) {
            const fila = document.createElement("tr");
            const celda = document.createElement("td");
            celda.colSpan = 5;
            celda.className = "text-center text-body-secondary";
            celda.textContent = "No hay solicitudes pendientes.";
            fila.appendChild(celda);
            tablaPendientes.appendChild(fila);
            return;
        }

        pagina.forEach((prestamo) => {
                const fila = document.createElement("tr");
                agregarCelda(fila, prestamo.id);
                agregarCelda(fila, nombreUsuario(prestamo.usuarioId));
                agregarCelda(fila, nombreEquipo(prestamo.equipoId));
                agregarCelda(fila, fechaCorta(prestamo.fechaSolicitud));

                const acciones = document.createElement("td");
                const aprobar = document.createElement("button");
                aprobar.type = "button";
                aprobar.className = "btn btn-success btn-sm me-2";
                aprobar.textContent = "Aprobar";
                aprobar.onclick = () => cambiarEstado(prestamo, "aprobar");

                const rechazar = document.createElement("button");
                rechazar.type = "button";
                rechazar.className = "btn btn-danger btn-sm";
                rechazar.textContent = "Rechazar";
                rechazar.onclick = () => cambiarEstado(prestamo, "rechazar");

                acciones.append(aprobar, rechazar);
                fila.appendChild(acciones);
                tablaPendientes.appendChild(fila);
        });
    }

    const paginador = crearPaginador(document.getElementById("paginador"), dibujarPendientes);

    sesionActual.then(usuario => {
        if (usuario) cargarPendientes();
    });
</script>
</body>
</html>
