<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Solicitudes Pendientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvI7KJOGa2XVsw53Yke2bsdkBbjmmiX"
          crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
    <h1 class="mb-4">Gestión de Solicitudes Pendientes</h1>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Usuario</th>
                <th scope="col">Equipo</th>
                <th scope="col">Fecha</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody id="tablaPendientes"></tbody>
        </table>
    </div>
</main>

<script>
    const tablaPendientes = document.getElementById("tablaPendientes");

    function obtenerTokenCsrf() {
        const cookie = document.cookie
            .split("; ")
            .find((parte) => parte.startsWith("XSRF-TOKEN="));
        return cookie ? decodeURIComponent(cookie.substring("XSRF-TOKEN=".length)) : null;
    }

    async function prepararCsrf() {
        const respuesta = await fetch("/api/auth/csrf", { credentials: "same-origin" });
        if (!respuesta.ok) {
            throw new Error("No se pudo preparar la protección CSRF.");
        }
    }

    async function mensajeError(respuesta) {
        const texto = await respuesta.text();
        if (texto) {
            try {
                const detalle = JSON.parse(texto);
                return detalle.detail || detalle.message || detalle.error || texto;
            } catch {
                return texto;
            }
        }
        return `Error HTTP ${respuesta.status}`;
    }

    function agregarCelda(fila, valor) {
        const celda = document.createElement("td");
        celda.textContent = valor ?? "";
        fila.appendChild(celda);
    }

    async function cambiarEstado(id, accion) {
        try {
            if (!obtenerTokenCsrf()) {
                await prepararCsrf();
            }
            const token = obtenerTokenCsrf();
            if (!token) {
                throw new Error("No se recibió el token CSRF.");
            }

            const respuesta = await fetch(`/api/prestamos/${id}/${accion}`, {
                method: "PUT",
                credentials: "same-origin",
                headers: { "X-XSRF-TOKEN": token }
            });
            if (!respuesta.ok) {
                throw new Error(await mensajeError(respuesta));
            }

            alert(`Solicitud ${accion === "aprobar" ? "aprobada" : "rechazada"} correctamente.`);
            await cargarPendientes();
        } catch (error) {
            alert(`No se pudo ${accion === "aprobar" ? "aprobar" : "rechazar"} la solicitud: ${error.message}`);
        }
    }

    async function cargarPendientes() {
        try {
            const respuesta = await fetch("/api/prestamos/pendientes", { credentials: "same-origin" });
            if (!respuesta.ok) {
                throw new Error(await mensajeError(respuesta));
            }

            const prestamos = await respuesta.json();
            tablaPendientes.replaceChildren();

            if (prestamos.length === 0) {
                const fila = document.createElement("tr");
                const celda = document.createElement("td");
                celda.colSpan = 5;
                celda.className = "text-center text-body-secondary";
                celda.textContent = "No hay solicitudes pendientes.";
                fila.appendChild(celda);
                tablaPendientes.appendChild(fila);
                return;
            }

            prestamos.forEach((prestamo) => {
                const fila = document.createElement("tr");
                agregarCelda(fila, prestamo.id);
                agregarCelda(fila, prestamo.usuarioId);
                agregarCelda(fila, prestamo.equipoId);
                agregarCelda(fila, prestamo.fechaSolicitud);

                const acciones = document.createElement("td");
                const aprobar = document.createElement("button");
                aprobar.type = "button";
                aprobar.className = "btn btn-success btn-sm me-2";
                aprobar.textContent = "Aprobar";
                aprobar.addEventListener("click", () => cambiarEstado(prestamo.id, "aprobar"));

                const rechazar = document.createElement("button");
                rechazar.type = "button";
                rechazar.className = "btn btn-danger btn-sm";
                rechazar.textContent = "Rechazar";
                rechazar.addEventListener("click", () => cambiarEstado(prestamo.id, "rechazar"));

                acciones.append(aprobar, rechazar);
                fila.appendChild(acciones);
                tablaPendientes.appendChild(fila);
            });
        } catch (error) {
            alert(`No se pudieron cargar las solicitudes pendientes: ${error.message}`);
        }
    }

    cargarPendientes();
</script>
</body>
</html>
