<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incidencias · Préstamo de equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/estilo.css" rel="stylesheet">
</head>
<body>
<header id="encabezado" class="bg-dark text-white py-3" data-rol="ADMIN"></header>
<main class="container py-4">
    <h1 class="mb-1">Incidencias de equipos</h1>
    <p class="text-body-secondary mb-4">Equipos devueltos con detalles o daños. Resuelve cada incidencia: atendida, mantenimiento, reparado o baja.</p>
    <div id="mensaje" class="alert" role="status" aria-live="polite" hidden></div>

    <form id="filtros" class="barra-filtros d-flex flex-wrap align-items-end gap-3 mb-3">
        <div>
            <label for="estadoIncidencia" class="form-label small mb-1">Mostrar</label>
            <select id="estadoIncidencia" class="form-select">
                <option value="ABIERTAS">Abiertas</option>
                <option value="MANTENIMIENTO">En mantenimiento</option>
                <option value="ATENDIDAS">Atendidas</option>
                <option value="TODAS">Todas</option>
            </select>
        </div>
        <div class="flex-grow-1 campo-busqueda">
            <label for="textoBusqueda" class="form-label small mb-1">Buscar</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input id="textoBusqueda" type="search" class="form-control" placeholder="Equipo, código o usuario">
            </div>
        </div>
        <button id="actualizar" type="submit" class="btn btn-outline-secondary" title="Actualizar" aria-label="Actualizar">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th scope="col">Préstamo</th>
                <th scope="col">Equipo</th>
                <th scope="col">Usuario</th>
                <th scope="col">Condición</th>
                <th scope="col">Observaciones</th>
                <th scope="col">Devuelto</th>
                <th scope="col">Estado</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody id="registros"></tbody>
        </table>
    </div>
    <div id="paginador" class="pie-tabla"></div>
    <p id="vacio" class="py-4 text-center text-body-secondary" hidden>No hay incidencias para este filtro.</p>

    <dialog id="modalResolver" class="modal-dialogo" aria-labelledby="tituloResolver">
        <form id="formResolver">
            <h2 id="tituloResolver" class="h4 mb-3">Resolver incidencia</h2>
            <p id="detalleResolver"></p>
            <div class="mb-3">
                <label for="resolucion" class="form-label">¿Cómo se resuelve?</label>
                <select id="resolucion" class="form-select"></select>
            </div>
            <p id="errorResolver" class="alert alert-danger py-2" role="alert" hidden></p>
            <div class="d-flex flex-wrap justify-content-end gap-2">
                <button id="cancelarResolver" type="button" class="btn btn-outline-secondary">Cancelar</button>
                <button id="confirmarResolver" type="submit" class="btn btn-primary">Confirmar</button>
            </div>
        </form>
    </dialog>
</main>
<script src="/js/encabezado.js"></script>
<script src="/js/incidencias.js"></script>
</body>
</html>
