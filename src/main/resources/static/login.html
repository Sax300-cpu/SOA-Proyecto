<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Préstamo de equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<main class="container" style="max-width: 400px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Iniciar sesión</h1>
            <p class="text-body-secondary mb-3">Sistema de préstamo de equipos tecnológicos</p>
            <div id="mensaje" class="alert alert-danger" role="alert" hidden></div>
            <form id="loginForm" onsubmit="iniciarSesion(event)" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input id="username" name="username" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button id="entrar" type="button" class="btn btn-primary w-100" onclick="iniciarSesion()">Entrar</button>
            </form>
            <hr class="my-3">
            <p class="text-center text-body-secondary small mb-2">¿No tienes una cuenta?</p>
            <a href="/registro.html" class="btn btn-outline-secondary w-100">Registrar nuevo usuario</a>
        </div>
    </div>
</main>
<script>
'use strict';

// Si ya hay una sesión activa, ir directo al inicio.
fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(r => { if (r.ok) window.location.replace('/'); })
    .catch(() => {});

if (new URLSearchParams(window.location.search).has('registrado')) {
    mostrarMensaje('Cuenta creada correctamente. Ya puedes iniciar sesión.', 'success');
}

function mostrarMensaje(texto, tipo = 'danger') {
    const mensaje = document.getElementById('mensaje');
    mensaje.className = `alert alert-${tipo}`;
    mensaje.textContent = texto;
    mensaje.hidden = false;
}

async function iniciarSesion(evento) {
    if (evento) evento.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const entrar = document.getElementById('entrar');
    document.getElementById('mensaje').hidden = true;

    if (!username || !password) {
        mostrarMensaje('Debes ingresar el usuario y la contraseña.');
        return;
    }

    entrar.disabled = true;
    try {
        const csrfRespuesta = await fetch('/api/auth/csrf', { credentials: 'same-origin' });
        const csrf = await csrfRespuesta.json();

        const respuesta = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                [csrf.headerName]: csrf.token
            },
            body: new URLSearchParams({ username, password })
        });

        if (respuesta.ok) {
            window.location.replace('/');
            return;
        }

        const datos = await respuesta.json().catch(() => null);
        mostrarMensaje((datos && datos.error) ? datos.error : 'No se pudo iniciar sesión.');
    } catch (error) {
        mostrarMensaje('Error de conexión. Inténtalo de nuevo.');
    } finally {
        entrar.disabled = false;
    }
}
</script>
</body>
</html>
