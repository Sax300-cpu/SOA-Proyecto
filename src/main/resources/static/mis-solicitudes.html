<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis Solicitudes de Préstamo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvI7KJOGa2XVsw53Yke2bsdkBbjmmiX"
          crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
    <h1 class="mb-4">Mis Solicitudes de Préstamo</h1>

    <form id="formSolicitud" class="row g-3 mb-5">
        <div class="col-md-4">
            <label for="usuarioId" class="form-label">Usuario ID</label>
            <input id="usuarioId" name="usuarioId" type="number" min="1" class="form-control">
            <div class="form-text">El backend identifica al usuario mediante la sesión.</div>
        </div>
        <div class="col-md-4">
            <label for="equipoId" class="form-label">Equipo ID</label>
            <input id="equipoId" name="equipoId" type="number" min="1" required class="form-control">
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Solicitar Equipo</button>
        </div>
    </form>

    <h2 class="h4 mb-3">Historial</h2>
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Equipo</th>
                <th scope="col">Estado</th>
                <th scope="col">Fecha de solicitud</th>
                <th scope="col">Observación</th>
            </tr>
            </thead>
            <tbody id="tablaHistorial"></tbody>
        </table>
    </div>
</main>

<script>
    const formSolicitud = document.getElementById("formSolicitud");
    const tablaHistorial = document.getElementById("tablaHistorial");

    function obtenerTokenCsrf() {
        const cookie = document.cookie
            .split("; ")
            .find((parte) => parte.startsWith("XSRF-TOKEN="));
        return cookie ? decodeURIComponent(cookie.substring("XSRF-TOKEN=".length)) : null;
    }

    async function prepararCsrf() {
        const respuesta = await fetch("/api/auth/csrf", { credentials: "same-origin" });
        if (!respuesta.ok) {
            throw new Error("No se pudo preparar la protección CSRF.");
        }
    }

    async function mensajeError(respuesta) {
        const texto = await respuesta.text();
        if (texto) {
            try {
                const detalle = JSON.parse(texto);
                return detalle.detail || detalle.message || detalle.error || texto;
            } catch {
                return texto;
            }
        }
        return `Error HTTP ${respuesta.status}`;
    }

    function agregarCelda(fila, valor) {
        const celda = document.createElement("td");
        celda.textContent = valor ?? "";
        fila.appendChild(celda);
    }

    async function cargarHistorial() {
        try {
            const respuesta = await fetch("/api/prestamos/mios", { credentials: "same-origin" });
            if (!respuesta.ok) {
                throw new Error(await mensajeError(respuesta));
            }

            const prestamos = await respuesta.json();
            tablaHistorial.replaceChildren();

            if (prestamos.length === 0) {
                const fila = document.createElement("tr");
                const celda = document.createElement("td");
                celda.colSpan = 5;
                celda.className = "text-center text-body-secondary";
                celda.textContent = "No tienes solicitudes.";
                fila.appendChild(celda);
                tablaHistorial.appendChild(fila);
                return;
            }

            prestamos.forEach((prestamo) => {
                const fila = document.createElement("tr");
                agregarCelda(fila, prestamo.id);
                agregarCelda(fila, prestamo.equipoId);
                agregarCelda(fila, prestamo.estado);
                agregarCelda(fila, prestamo.fechaSolicitud);
                agregarCelda(fila, prestamo.observacion);
                tablaHistorial.appendChild(fila);
            });
        } catch (error) {
            alert(`No se pudo cargar el historial: ${error.message}`);
        }
    }

    formSolicitud.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const tokenCsrf = obtenerTokenCsrf();

        try {
            if (!tokenCsrf) {
                await prepararCsrf();
            }
            const token = obtenerTokenCsrf();
            if (!token) {
                throw new Error("No se recibió el token CSRF.");
            }

            const equipoId = Number(document.getElementById("equipoId").value);
            const respuesta = await fetch("/api/prestamos", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-XSRF-TOKEN": token
                },
                body: JSON.stringify({ equipoId })
            });

            if (!respuesta.ok) {
                throw new Error(await mensajeError(respuesta));
            }

            alert("Solicitud creada correctamente.");
            formSolicitud.reset();
            await cargarHistorial();
        } catch (error) {
            alert(`No se pudo crear la solicitud: ${error.message}`);
        }
    });

    cargarHistorial();
</script>
</body>
</html>
