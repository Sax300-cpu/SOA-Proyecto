<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de usuario · Préstamo de equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<main class="container" style="max-width: 420px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Registrar nuevo usuario</h1>
            <p class="text-body-secondary mb-3">Crea tu cuenta para solicitar equipos tecnológicos</p>
            <div id="mensaje" class="alert alert-danger" role="alert" hidden></div>
            <form id="registroForm" onsubmit="registrarUsuario(event)" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input id="nombre" name="nombre" class="form-control" maxlength="50" autocomplete="name" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input id="username" name="username" class="form-control" maxlength="30" autocomplete="username" required>
                    <div class="form-text">Sin espacios, máximo 30 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" name="password" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
                    <div class="form-text">Mínimo 8 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
                    <input id="confirmarPassword" name="confirmarPassword" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
                </div>
                <button id="registrar" type="button" class="btn btn-primary w-100" onclick="registrarUsuario()">Registrarse</button>
            </form>
            <hr class="my-3">
            <a href="/login.html" class="btn btn-outline-secondary w-100">Volver al inicio de sesión</a>
        </div>
    </div>
</main>
<script>
'use strict';

// Si ya hay una sesión activa, ir directo al inicio.
fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(r => { if (r.ok) window.location.replace('/'); })
    .catch(() => {});

function mostrarError(texto) {
    const mensaje = document.getElementById('mensaje');
    mensaje.textContent = texto;
    mensaje.hidden = false;
}

// Valida los datos, pide el token CSRF y crea la cuenta USUARIO en POST /api/auth/registro.
async function registrarUsuario(evento) {
    if (evento) evento.preventDefault();

    const nombre = document.getElementById('nombre').value.trim();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirmarPassword = document.getElementById('confirmarPassword').value;
    const boton = document.getElementById('registrar');
    document.getElementById('mensaje').hidden = true;

    if (!nombre || !username || !password || !confirmarPassword) {
        mostrarError('Todos los campos son obligatorios.');
        return;
    }
    if (username.includes(' ')) {
        mostrarError('El nombre de usuario no debe contener espacios.');
        return;
    }
    if (password.length < 8) {
        mostrarError('La contraseña debe tener al menos 8 caracteres.');
        return;
    }
    if (password !== confirmarPassword) {
        mostrarError('Las contraseñas no coinciden.');
        return;
    }

    boton.disabled = true;
    try {
        const csrfRespuesta = await fetch('/api/auth/csrf', { credentials: 'same-origin' });
        if (!csrfRespuesta.ok) {
            throw new Error('No se pudo preparar la solicitud.');
        }
        const csrf = await csrfRespuesta.json();

        const respuesta = await fetch('/api/auth/registro', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                [csrf.headerName]: csrf.token
            },
            body: JSON.stringify({ nombre, username, password })
        });

        if (respuesta.ok) {
            window.location.replace('/login.html?registrado=1');
            return;
        }

        const datos = await respuesta.json().catch(() => null);
        mostrarError((datos && datos.error) ? datos.error : 'No se pudo registrar el usuario.');
    } catch (error) {
        mostrarError('Error de conexión. Inténtalo de nuevo.');
    } finally {
        boton.disabled = false;
    }
}
</script>
</body>
</html>
