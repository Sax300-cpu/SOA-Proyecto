<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de usuario · Préstamo de equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<main class="container" style="max-width: 420px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Registrar nuevo usuario</h1>
            <p class="text-body-secondary mb-3">Crea tu cuenta para solicitar equipos tecnológicos</p>
            <div id="mensaje" class="alert alert-danger" role="alert" hidden></div>
            <form id="registroForm" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input id="nombre" name="nombre" class="form-control" maxlength="50" autocomplete="name" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input id="username" name="username" class="form-control" maxlength="30" autocomplete="username" required>
                    <div class="form-text">Sin espacios, máximo 30 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" name="password" type="password" class="form-control" minlength="6" maxlength="72" autocomplete="new-password" required>
                    <div class="form-text">Mínimo 6 caracteres.</div>
                </div>
                <button id="registrar" type="submit" class="btn btn-primary w-100">Registrarse</button>
            </form>
            <hr class="my-3">
            <a href="/login.html" class="btn btn-outline-secondary w-100">Volver al inicio de sesión</a>
        </div>
    </div>
</main>
<script>
'use strict';

// Si ya hay una sesión activa, ir directo al inicio.
fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(r => { if (r.ok) window.location.replace('/'); })
    .catch(() => {});

document.getElementById('registroForm').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('registrar');
    mensaje.hidden = true;
    boton.disabled = true;

    try {
        const csrfRespuesta = await fetch('/api/auth/csrf', { credentials: 'same-origin' });
        if (!csrfRespuesta.ok) {
            throw new Error('No se pudo preparar la solicitud.');
        }
        const csrf = await csrfRespuesta.json();

        const respuesta = await fetch('/api/auth/registro', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                [csrf.headerName]: csrf.token
            },
            body: JSON.stringify({
                nombre: document.getElementById('nombre').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            })
        });

        if (respuesta.ok) {
            window.location.replace('/login.html?registrado=1');
            return;
        }

        const datos = await respuesta.json().catch(() => null);
        mensaje.textContent = (datos && datos.error) ? datos.error : 'No se pudo registrar el usuario.';
        mensaje.hidden = false;
    } catch (error) {
        mensaje.textContent = 'Error de conexión. Inténtalo de nuevo.';
        mensaje.hidden = false;
    } finally {
        boton.disabled = false;
    }
});
</script>
</body>
</html>
